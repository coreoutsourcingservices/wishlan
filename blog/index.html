  <section class="news-section">
    <div class="auto-container">

      <div id="blogs-container" class="row clearfix"></div>

      <div class="pagination">
        <button class="btn1" onclick="prevPage()">
          Prev

  <script>
    let blogs = [];
    let currentPage = 1;
    const blogsPerPage = 6;

    async function loadBlogs() {
      try {
        const response = await fetch(
          "https://aliceblue-swan-648054.hostingersite.com/wishlan/get-blogs"
        );

        const result = await response.json();

        blogs = result.data || [];

        createPagination();
        showPage(1);

      } catch (error) {
        console.error("Error:", error);
      }
    }

    function stripHtml(html) {
      const div = document.createElement("div");
      div.innerHTML = html;
      return div.textContent || div.innerText || "";
    }

    function formatDate(dateString) {
      const date = new Date(dateString);

      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
      });
    }

    function showPage(page) {
      currentPage = page;

      const container = document.getElementById("blogs-container");

      const start = (page - 1) * blogsPerPage;
      const end = start + blogsPerPage;

      const currentBlogs = blogs.slice(start, end);

      container.innerHTML = currentBlogs
        .map((blog) => {
          return `
        <div class="news-block col-lg-4 col-md-6 col-sm-12">
          <div class="inner-box">

            <div class="image-box">
            <a href="/blog/bloge_detail.html?slug=${encodeURIComponent(blog.BlogHeadingURL)}">
                <img
                  src="${blog.BlogImage}"
                  alt="${blog.BlogHeading}"
                />
              </a>
            </div>

            <div class="lower-box">

              <div class="post-meta">
                <ul class="clearfix">
                  <li>
                    <span class="far fa-clock"></span>
                    ${formatDate(blog.createdAt)}
                  </li>

                  <li>
                    <span class="far fa-user-circle"></span>
                    ${blog.BlogWriter}
                  </li>
                </ul>
              </div>

              <h5>
               <a href="/blog/bloge_detail.html?slug=${encodeURIComponent(blog.BlogHeadingURL)}">
                  ${blog.BlogHeading}
                </a>
              </h5>

              <div class="text">
                ${stripHtml(blog.BlogContent).substring(0, 140)}...
              </div>

              <div class="link-box1">
              <a href="/blog/bloge_detail.html?slug=${encodeURIComponent(blog.BlogHeadingURL)}">
                  <span class="flaticon-next-1"></span>
                </a>
              </div>

            </div>
          </div>
        </div>
      `;
        })
        .join("");

      updatePagination();
    }

    function createPagination() {
      const totalPages = Math.ceil(
        blogs.length / blogsPerPage
      );

      const pagination =
        document.getElementById("pagination");

      pagination.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        pagination.innerHTML += `
      <li class="link"
          onclick="showPage(${i})">
        ${i}
      </li>
    `;
      }
    }

    function updatePagination() {
      document
        .querySelectorAll(".styled-pagination .link")
        .forEach((item, index) => {
          item.classList.toggle(
            "active1",
            index + 1 === currentPage
          );
        });
    }

    function prevPage() {
      if (currentPage > 1) {
        showPage(currentPage - 1);
      }
    }

    function nextPage() {
      const totalPages = Math.ceil(
        blogs.length / blogsPerPage
      );

      if (currentPage < totalPages) {
        showPage(currentPage + 1);
      }
    }

    loadBlogs();
  </script>

  <script>
    (function () {
      // Robust pagination handler
      const links = Array.from(
        document.querySelectorAll(".pagination .link")
      );
      const totalPages = links.length;
      let currentPage = 1;

      function showPage(page) {
        // bounds
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        currentPage = page;

        // update link classes
        links.forEach((l) => {
          l.classList.toggle(
            "active1",
            Number(l.getAttribute("data-value")) === page
          );
        });

        // hide all pages
        document
          .querySelectorAll(".page-content")
          .forEach((p) => (p.style.display = "none"));

        // show requested page if exists
        const el = document.getElementById(`page-${page}`);
        if (el) el.style.display = "block";
      }

      // attach click handlers
      links.forEach((l) => {
        l.addEventListener("click", function (e) {
          const v = Number(this.getAttribute("data-value")) || 1;
          showPage(v);
        });
      });

      // prev/next buttons
      window.backBtn = function () {
        if (currentPage > 1) showPage(currentPage - 1);
      };
      window.nextBtn = function () {
        if (currentPage < totalPages) showPage(currentPage + 1);
      };

      // initialize
      showPage(1);
    })();
  </script>
