  <script>

    async function loadSingleBlog() {

const slug = window.location.pathname.split("/").pop();

const blogId = sessionStorage.getItem("blogId");

// console.log(blogId);

      // console.log("blog slug:", slug);

      if (!slug) {
        document.getElementById("loader").innerHTML = "Blog Not Found";
        return;
      }

      try {
        const response = await fetch(
          `https://pk.coreoutsourcingservices.in/wishlan/get-blogs/${blogId}`
        );

        const result = await response.json();

        const blog = result.data;

        document.title = blog.BlogHeading;

        document.getElementById("blogTitle")
          .innerText = blog.BlogHeading;

        document.getElementById("blogWriter")
          .innerText = blog.BlogWriter;

        document.getElementById("blogDate")
          .innerText = new Date(
            blog.createdAt
          ).toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "long",
            year: "numeric"
          });

        document.getElementById("blogImage")
          .src = blog.BlogImage;
          blogImage.alt = `${blog.BlogHeading} | ${blog.BlogWriter}`;
        document.getElementById("blogContent")
          .innerHTML = blog.BlogContent;

        document.getElementById("loader")
          .style.display = "none";

        document.getElementById("blogSection")
          .style.display = "block";

      }

      catch (error) {

        console.log(error);

        document.getElementById("loader")
          .innerHTML = "Failed To Load Blog";

      }

    }

    loadSingleBlog();

  </script>
